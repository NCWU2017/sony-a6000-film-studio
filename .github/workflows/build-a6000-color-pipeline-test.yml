name: Build A6000 Color Pipeline Test

on:
  push:
    branches:
      - build/color-pipeline-test-20260930
    paths:
      - 'tools/a6000-color-pipeline-test/**'
      - '.github/workflows/build-a6000-color-pipeline-test.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate Android SDK
        shell: bash
        run: |
          set -eux
          echo "ANDROID_HOME=$ANDROID_HOME"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          PLATFORM="$(find "$ANDROID_HOME/platforms" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "BT=$BT" >> "$GITHUB_ENV"
          echo "ANDROID_JAR=$PLATFORM/android.jar" >> "$GITHUB_ENV"
          "$BT/aapt" version
          "$BT/d8" --version

      - name: Prepare v1.7 Telnet parser fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("tools/a6000-color-pipeline-test/src/com/sonylut/colortest/MainActivity.java")
          s=p.read_text()

          old='''                String marker="__END_"+System.currentTimeMillis()+"__";
                out.write((command+"; echo "+marker+"\\r\\n").getBytes("US-ASCII"));
                out.flush();
                ByteArrayOutputStream buf=new ByteArrayOutputStream();
                long deadline=System.currentTimeMillis()+6000;
                while(System.currentTimeMillis()<deadline) {
                    try {
                        int b=readTelnetByte(in,out);
                        if(b<0) break;
                        buf.write(b);
                        String cur=new String(buf.toByteArray(),"ISO-8859-1");
                        int m=findStandaloneMarker(cur,marker);
                        if(m>=0) {
                            telnetPort=ports[pi];
                            try{sock.close();}catch(Throwable ignored){}
                            return cur.substring(0,m);
                        }
                    } catch(SocketTimeoutException timeout) {}
                }
'''
          new='''                out.write((command+"; echo __DONE_$__\\r\\n").getBytes("US-ASCII"));
                out.flush();
                ByteArrayOutputStream buf=new ByteArrayOutputStream();
                long deadline=System.currentTimeMillis()+6000;
                while(System.currentTimeMillis()<deadline) {
                    try {
                        int b=readTelnetByte(in,out);
                        if(b<0) break;
                        buf.write(b);
                        String cur=new String(buf.toByteArray(),"ISO-8859-1");
                        int m=findExpandedDoneMarker(cur);
                        if(m>=0) {
                            telnetPort=ports[pi];
                            try{sock.close();}catch(Throwable ignored){}
                            return cur.substring(0,m);
                        }
                    } catch(SocketTimeoutException timeout) {}
                }
'''
          if old not in s:
              raise SystemExit("telnet marker block not found")
          s=s.replace(old,new,1)

          old2='''    private static int findStandaloneMarker(String cur,String marker) {
        int from=0;
        while(true) {
            int m=cur.indexOf(marker,from);
            if(m<0) return -1;
            boolean lineStart=(m==0 || cur.charAt(m-1)=='\\n' || cur.charAt(m-1)=='\\r');
            if(lineStart) return m;
            from=m+marker.length();
        }
    }
'''
          new2='''    private static int findExpandedDoneMarker(String cur) {
        String prefix="__DONE_";
        int from=0;
        while(true) {
            int m=cur.indexOf(prefix,from);
            if(m<0) return -1;
            int i=m+prefix.length(),j=i;
            while(j<cur.length() && Character.isDigit(cur.charAt(j))) j++;
            if(j>i && j+1<cur.length() && cur.charAt(j)=='_' && cur.charAt(j+1)=='_')
                return m;
            from=m+prefix.length();
        }
    }
'''
          if old2 not in s:
              raise SystemExit("marker helper not found")
          s=s.replace(old2,new2,1)
          s=s.replace("A6000 REVISION R_GAIN TEST  v1.6","A6000 REVISION R_GAIN TEST  v1.7")
          p.write_text(s)

          m=Path("tools/a6000-color-pipeline-test/AndroidManifest.xml")
          x=m.read_text()
          import re
          x=re.sub(r'android:versionCode="\d+"','android:versionCode="17"',x)
          x=re.sub(r'android:versionName="[^"]+"','android:versionName="1.7"',x)
          m.write_text(x)
          PY

      - name: Compile APK
        shell: bash
        working-directory: tools/a6000-color-pipeline-test
        run: |
          set -euxo pipefail
          rm -rf classes out
          mkdir -p classes out

          javac -source 7 -target 7 -Xlint:-options \
            -bootclasspath "$ANDROID_JAR" \
            -d classes \
            src/com/sonylut/colortest/MainActivity.java

          "$BT/d8" --min-api 10 --output out $(find classes -name '*.class' -print)

          "$BT/aapt" package -f \
            -M AndroidManifest.xml \
            -I "$ANDROID_JAR" \
            -F out/A6000_ColorPipeline_Test-unsigned.apk

          (cd out && zip -q A6000_ColorPipeline_Test-unsigned.apk classes.dex)

      - name: Legacy v1 sign
        shell: bash
        working-directory: tools/a6000-color-pipeline-test
        run: |
          set -euxo pipefail
          keytool -genkeypair -alias colortest -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore out/debug.keystore -storepass android -keypass android \
            -dname "CN=A6000ColorTest,O=Community,C=US"

          printf 'jdk.jar.disabledAlgorithms=\n' > out/legacy.properties
          cp out/A6000_ColorPipeline_Test-unsigned.apk out/A6000_ColorPipeline_Test.apk
          jarsigner -J-Djava.security.properties=out/legacy.properties \
            -keystore out/debug.keystore -storepass android -keypass android \
            -sigalg SHA1withRSA -digestalg SHA1 \
            out/A6000_ColorPipeline_Test.apk colortest

          sha256sum out/A6000_ColorPipeline_Test*.apk | tee out/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: A6000_ColorPipeline_Test
          path: |
            tools/a6000-color-pipeline-test/out/A6000_ColorPipeline_Test.apk
            tools/a6000-color-pipeline-test/out/A6000_ColorPipeline_Test-unsigned.apk
            tools/a6000-color-pipeline-test/out/SHA256SUMS.txt
          if-no-files-found: error
